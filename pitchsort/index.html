<!doctype html>
<html>
<head><meta charset="utf-8"><title>PitchSort</title>
<style>
  :root { --fs: 15px }
  body { background:#0b0b0f; color:#e8e8ee; font:var(--fs)/1.5 ui-monospace, monospace; margin:0;
         display:grid; place-items:center; min-height:100vh }
  /* small-screen hardware: scale the whole board, controls cheat-sheet no longer fits */
  @media (max-width: 720px), (max-height: 560px) {
    :root { --fs: clamp(9px, 2.8vmin, 15px) }
    .ctl-groups { display:none }
  }
  #debug { text-align:center; transition:opacity .25s, transform .25s }
  #debug.fade { opacity:0; transform:translateY(-14px) }
  h2 { font-size:1.05em; font-weight:600; letter-spacing:.08em; color:#999; transition:color .2s }
  h2.win { color:#8fffa8 }
  .star { color:#3a3a3a; font-size:1.2em; }
  .star.full { color:#ffd700; text-shadow:0 0 12px #ffd70066 }
  .star.half { background:linear-gradient(90deg, #ffd700 50%, #3a3a3a 50%);
               -webkit-background-clip:text; background-clip:text; color:transparent }

  .row { display:flex; gap:2em; align-items:flex-start; justify-content:center }
  .col { min-width:4.6em; min-height:13em; padding:.9em 1em; border-radius:14px;
         background:#ffffff08; border:1px solid #ffffff10;
         transition:border-color .2s }
  .col.active { border-color:#ffffff40 }
  .col.sounding { border-color:#fff }
  .col h3 { margin:0 0 .7em; font-size:.7em; font-weight:500; color:#555; letter-spacing:.25em }

  .note { display:block; width:2.6em; height:1.1em; margin:.5em auto; border-radius:6px;
          box-shadow:inset 0 -3px 0 #0003;
          transition:transform .18s cubic-bezier(.34,1.56,.64,1), filter .18s }
  .note.cursor { transform:scale(1.15); filter:brightness(1.25); }
  .note.cursor::after { content:''; display:block; height:100%; border-radius:6px;
                        outline:2px solid #fffc; outline-offset:2px }
  .note.captured { opacity:.85; filter:brightness(.8) saturate(.6); animation:grab .5s ease-in-out infinite }
  .note.sounding { filter:brightness(1.7); transform:scale(1.06) }
  @keyframes grab { 50% { transform:scale(1.08) } }

  .win .note { animation:pop .4s cubic-bezier(.34,1.56,.64,1) forwards }
  @keyframes pop { 50% { transform:scale(1.3); filter:brightness(1.8) } 100% { transform:scale(1.05) } }
  /* win: board dims so chord flashes + banner own the moment */
  .win .col { filter:brightness(.55) saturate(.8); transition:filter .2s }
  .win .col .note.sounding { filter:brightness(3) }
  .row.shake { animation:shake .16s linear }
  @keyframes shake { 20%,60% { transform:translateX(-4px) } 40%,80% { transform:translateX(4px) } }

  @media (prefers-reduced-motion: reduce) {
    .row.shake, .note.attract, .col.invite, .kchip.pulse { animation:none }
    .win .note, #banner.show span { animation-duration:.01s }
  }

  .meta { color:#444; font-size:.85em; letter-spacing:.1em }

  .controls { display:flex; flex-wrap:wrap; gap:.4em 1.2em; justify-content:center;
              max-width:44em; margin:.6em auto 0 }
  .ctl-groups { display:flex; gap:2.5em; justify-content:center; align-items:flex-start; margin-top:1.4em }
  .ctl-group { transition:opacity .3s }
  .ctl-group.dim { opacity:.35 }
  .ctl-head { display:flex; align-items:center; gap:.6em; justify-content:center; color:#888;
              font-size:.85em; letter-spacing:.15em; text-transform:uppercase; margin-bottom:.4em }
  .ctl { display:flex; align-items:center; gap:.45em; color:#777; font-size:.8em }
  .kchip { border:1px solid #444; border-bottom-width:2px; border-radius:6px; padding:.1em .5em;
           background:#ffffff10; color:#ccc; font-weight:600 }
  /* diegetic tutorial cues: things breathe/invite instead of text explaining */
  .note.attract { animation:attract 1.2s ease-in-out infinite }
  @keyframes attract { 50% { transform:scale(1.14); filter:brightness(1.45) } }
  .col.invite { animation:invite 1.1s ease-in-out infinite }
  @keyframes invite { 50% { border-color:#9fd0aa; box-shadow:0 0 14px #9fd0aa33 } }
  .kchip.pulse { animation:chippulse 1s ease-in-out infinite; border-color:#9fd0aa; color:#cfffd9 }
  @keyframes chippulse { 50% { transform:translateY(-2px); box-shadow:0 3px 10px #9fd0aa44 } }

  #banner { position:fixed; top:0; right:0; bottom:0; left:0; /* inset:0 */ inset:0;
            display:grid; place-items:center; pointer-events:none; z-index:20 }
  #banner span { font-size:3.4em; font-weight:800; letter-spacing:.08em; color:#9fffb0; opacity:0;
                 text-shadow:0 0 60px #4f86, 0 0 24px #4f84; }
  #banner.show span { animation:banner 2.4s cubic-bezier(.2,1.2,.3,1) forwards }
  @keyframes banner {
    0% { opacity:0; transform:scale(.3) }
    14% { opacity:1; transform:scale(1.08) }
    22% { transform:scale(1) }
    75% { opacity:1; transform:scale(1) }
    100% { opacity:0; transform:scale(.98) }
  }
  .confetti { position:fixed; top:0; left:0; width:10px; height:14px; border-radius:2px;
              pointer-events:none; z-index:15 }

  #hud { position:fixed; top:.8em; left:0; right:0; text-align:center; font-size:.85em;
         letter-spacing:.12em; color:#666; pointer-events:none; z-index:10 }
  #streakbadge { display:inline-block; color:#ffb25e; font-weight:700; letter-spacing:.08em }
  #streakbadge em { font-style:normal; color:#f7d774 }
  #streakbadge.pop { animation:spop .3s cubic-bezier(.34,1.56,.64,1) }
  @keyframes spop { 40% { transform:scale(1.5) } }
  .streak-lost { display:inline-block; color:#ff6b6b; font-weight:700;
                 animation:slost 1.8s ease-out forwards }
  @keyframes slost {
    10%,30%,50% { transform:translateX(-4px) }  20%,40%,60% { transform:translateX(4px) }
    70% { transform:none; opacity:1 }  100% { opacity:0 }
  }
  #banner small { display:block; font-size:.42em; letter-spacing:.1em; color:#ffe9a8;
                  text-shadow:0 0 20px #fc03; margin-top:.3em }
</style>
</head>
<body>
<div id="hud"></div>
<div id="banner"></div>
<div id="debug">Connect gamepad, press any button…</div>
<script type="module" src="game.js"></script>
</body>
</html>
