<!doctype html>
<html>
<head><meta charset="utf-8"><title>PitchSort</title>
<style>
  body { background:#111; color:#ddd; font:16px/1.6 monospace; margin:0; display:grid; place-items:center; min-height:100vh }
  .row { display:flex; gap:2.5em; align-items:flex-start }
  .col { min-width:6em; min-height:14em; padding:1em 1.2em; border:2px solid #333; border-radius:10px;
         transition:border-color .25s, box-shadow .25s }
  .col.active { border-color:#888; box-shadow:0 0 18px #ffffff22 }
  .col h3 { margin:0 0 .6em; font-size:.85em; color:#666; letter-spacing:.15em }
  h2 { font-size:1.2em; transition:color .3s }
  h2.win { color:#7fff9f }
  #debug { text-align:center; transition:opacity .5s, transform .5s }
  #debug.fade { opacity:0; transform:translateY(-20px) }

  .note { display:block; width:3.2em; margin:.45em auto; padding:.55em 0; border-radius:8px;
          color:#fff; font-weight:bold; text-shadow:0 1px 3px #0008; cursor:default;
          transition:transform .22s cubic-bezier(.34,1.56,.64,1), box-shadow .22s }
  .note.cursor { transform:scale(1.18); animation:glow .9s ease-in-out infinite }
  .note.captured { animation:grab .5s ease-in-out infinite; box-shadow:0 0 22px #fff9 }
  @keyframes glow { 50% { box-shadow:0 0 14px #fffa } }
  @keyframes grab { 50% { transform:scale(1.12) translateY(-3px) } }

  .win .note { animation:pop .5s cubic-bezier(.34,1.56,.64,1) forwards }
  @keyframes pop { 50% { transform:scale(1.35); filter:brightness(2) } 100% { transform:scale(1.1); filter:brightness(1.4) } }
</style>
</head>
<body>
<div id="debug">Connect gamepad, press any button…</div>
<script type="module" src="game.js"></script>
</body>
</html>
